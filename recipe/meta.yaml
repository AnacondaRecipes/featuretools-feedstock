{% set version = "1.31.0" %}

package:
  name: featuretools
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/featuretools/featuretools-{{ version }}.tar.gz
  sha256: 01bfb17fcc1715b4c3623c7bc94a8982122c4a0fa03350ed478601bb81f90155

build:
  skip: true  # [py<39 or s390x]
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.0.0
  run:
    - cloudpickle >=1.5.0
    - holidays >=0.17
    - numpy >=1.25.0
    - packaging >=20.0
    - pandas >=2.0.0
    - psutil >=5.7.0
    - python
    - scipy >=1.10.0
    - tqdm >=4.66.3
    - woodwork >=0.28.0
  run_constrained:
    - autonormalize >=2.0.1
    - dask-core >=2023.2.0
    - distributed >=2023.2.0
    - nlp-primitives >=2.12.0
    - premium-primitives >=0.0.3
    - featuretools-sklearn-transformer >=1.0.0
    - featuretools_sql >=0.0.1
    - psycopg2-binary >=2.9.3
    - featuretools-tsfresh-primitives >=1.0.0

test:
  commands:
    # docker-py has an exact pinning for pywin32 that cause pip check to fail.
    - pip check  # [not win]
    #test_nans fails with Intel MKL, so openblas is used
    - pytest --pyargs featuretools -v -k "not test_nans"  # [win]
    - pytest --pyargs featuretools -v  # [not win]
  imports:
    - featuretools
  requires:
    - pip
    - boto3 >=1.17.46
    - composeml >=0.8.0
    - graphviz >=0.8.4
    - moto >=3.0.7
    - pyarrow >=3.0.0,<13.0.0
    - pympler >=0.8
    - pytest >=7.1.2
    - pytest-timeout >=2.1.0
    - pytest-xdist >=2.5.0
    - python-graphviz >=0.8.4
    - smart_open >=5.0.0
    - urllib3 >=1.26.5
    - openblas  # [not win]

about:
  doc_url: https://featuretools.alteryx.com
  dev_url: https://github.com/alteryx/Featuretools
  home: https://featuretools.com/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: a framework for automated feature engineering
  description: |
    Featuretools is a framework to perform automated feature engineering.
    It excels at transforming temporal and relational datasets into
    feature matrices for machine learning.



extra:
  recipe-maintainers:
    - stefaniesmith
    - sbadithe
    - ozzieD
    - machineAYX
    - rwedge
    - tamargrey
    - thehomebrewnerd
    - jeff-hernandez
    - gsheni
    - dvreed77
